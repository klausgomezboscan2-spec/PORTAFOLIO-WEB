<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Debug Console - El Sabor de la Vida</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
        #console { background: #1a1a1a; border: 1px solid #00ff00; padding: 15px; height: 500px; overflow-y: auto; margin-bottom: 20px; }
        .error { color: #ff4444; }
        .warn { color: #ffaa00; }
        .info { color: #00ff00; }
        .log { color: #cccccc; }
        button { background: #00ff00; color: #000; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #00dd00; }
    </style>
</head>
<body>
    <h1>🔍 Debug Console Capture</h1>
    <button onclick="testApp()">Test App Load</button>
    <button onclick="testMenu()">Test Menu</button>
    <button onclick="testCart()">Test Cart</button>
    <button onclick="clearConsole()">Clear</button>
    <div id="console"></div>
    <script>
        const consoleDiv = document.getElementById('console');
        const logs = [];
        
        function addLog(msg, type='log') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${msg}`;
            logs.push({msg: entry, type});
            const line = document.createElement('div');
            line.className = type;
            line.textContent = entry;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Intercept console
        const origLog = console.log, origError = console.error, origWarn = console.warn;
        console.log = (...args) => { addLog(args.join(' '), 'info'); origLog(...args); };
        console.error = (...args) => { addLog(args.join(' '), 'error'); origError(...args); };
        console.warn = (...args) => { addLog(args.join(' '), 'warn'); origWarn(...args); };
        
        window.addEventListener('error', (e) => {
            addLog(`UNCAUGHT ERROR: ${e.message} (${e.filename}:${e.lineno})`, 'error');
        });
        
        function testApp() {
            addLog('Starting app test...', 'info');
            try {
                // Check if main functions exist
                if (typeof renderMenu === 'undefined') throw new Error('renderMenu is undefined');
                if (typeof calculateEventEstimate === 'undefined') throw new Error('calculateEventEstimate is undefined');
                if (typeof setupMenuAnchorHighlight === 'undefined') throw new Error('setupMenuAnchorHighlight is undefined');
                addLog('✓ All main functions exist', 'info');
                addLog(`✓ menuItems count: ${menuItems?.length || 0}`, 'info');
                addLog(`✓ Categories: Entradas, Plato fuerte, Bebidas, Postre, Adiciones`, 'info');
            } catch (e) {
                addLog(`✗ Error: ${e.message}`, 'error');
            }
        }
        
        function testMenu() {
            addLog('Testing menu rendering...', 'info');
            try {
                const grid = document.getElementById('menu-grid');
                if (!grid) throw new Error('menu-grid not found');
                addLog(`✓ menu-grid exists`, 'info');
                const sections = grid.querySelectorAll('.menu-category-section');
                addLog(`✓ Found ${sections.length} sections`, 'info');
                sections.forEach((s, i) => {
                    const title = s.querySelector('h3')?.textContent || 'Unknown';
                    const items = s.querySelectorAll('.page-card');
                    addLog(`  - ${title}: ${items.length} items`, 'log');
                });
            } catch (e) {
                addLog(`✗ Error: ${e.message}`, 'error');
            }
        }
        
        function testCart() {
            addLog('Testing cart...', 'info');
            try {
                const drawer = document.getElementById('cart-drawer');
                const nameInput = document.getElementById('order-customer-name');
                const tableInput = document.getElementById('order-table-number');
                const addressInput = document.getElementById('order-address');
                const deliverySelect = document.getElementById('delivery-type');
                
                if (!drawer) throw new Error('cart-drawer not found');
                if (!nameInput) throw new Error('order-customer-name not found');
                if (!tableInput) throw new Error('order-table-number not found');
                if (!addressInput) throw new Error('order-address not found');
                if (!deliverySelect) throw new Error('delivery-type not found');
                
                addLog('✓ All cart form elements exist', 'info');
                addLog(`✓ Delivery type options: ${Array.from(deliverySelect.options).map(o => o.value).join(', ')}`, 'info');
            } catch (e) {
                addLog(`✗ Error: ${e.message}`, 'error');
            }
        }
        
        function clearConsole() {
            consoleDiv.innerHTML = '';
            logs.length = 0;
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            addLog('Page fully loaded', 'info');
            setTimeout(testApp, 500);
        });
    </script>
</body>
</html>
