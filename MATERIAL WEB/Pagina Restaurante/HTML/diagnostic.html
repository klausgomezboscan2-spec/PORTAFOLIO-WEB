<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Diagnostic - El Sabor de la Vida</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .diagnostic-panel { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .diagnostic-panel h3 { margin-top: 0; color: #333; }
        .item { padding: 8px 12px; margin: 5px 0; background: #f9f9f9; border-left: 4px solid #4CAF50; }
        .item.error { border-left-color: #f44336; background: #ffebee; }
        .item.warn { border-left-color: #ff9800; background: #fff3e0; }
        .code { background: #2c3e50; color: #ecf0f1; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; overflow-x: auto; margin: 10px 0; }
        button { background: #2196F3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #0b7dda; }
        .result { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .result.ok { background: #d4edda; color: #155724; }
        .result.bad { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Comprehensive Diagnostic Report</h1>
        
        <div class="diagnostic-panel">
            <h3>Runtime Environment Check</h3>
            <div id="env-check"></div>
        </div>
        
        <div class="diagnostic-panel">
            <h3>Critical Functions & Variables</h3>
            <div id="functions-check"></div>
        </div>
        
        <div class="diagnostic-panel">
            <h3>DOM Elements Check</h3>
            <div id="dom-check"></div>
        </div>
        
        <div class="diagnostic-panel">
            <h3>Data Validation</h3>
            <div id="data-check"></div>
        </div>
        
        <div class="diagnostic-panel">
            <h3>Feature Tests</h3>
            <button onclick="testMenuRendering()">Test Menu Rendering</button>
            <button onclick="testEventCalculation()">Test Event Calculation</button>
            <button onclick="testCartFunctions()">Test Cart Functions</button>
            <div id="feature-results"></div>
        </div>
        
        <div class="diagnostic-panel">
            <h3>Console Output (Last 50 lines)</h3>
            <div id="console-output" style="max-height: 400px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;"></div>
        </div>
    </div>
    
    <script>
        const consoleOutput = document.getElementById('console-output');
        const consoleLogs = [];
        const MAX_LOGS = 50;
        
        function logToConsole(msg, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${msg}`;
            consoleLogs.push(line);
            if (consoleLogs.length > MAX_LOGS) consoleLogs.shift();
            updateConsoleDisplay();
        }
        
        function updateConsoleDisplay() {
            consoleOutput.textContent = consoleLogs.join('\n');
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        // Intercept console methods
        const origLog = console.log, origError = console.error, origWarn = console.warn;
        console.log = (...args) => { logToConsole('LOG: ' + args.join(' ')); origLog(...args); };
        console.error = (...args) => { logToConsole('ERROR: ' + args.join(' ')); origError(...args); };
        console.warn = (...args) => { logToConsole('WARN: ' + args.join(' ')); origWarn(...args); };
        
        window.addEventListener('error', (e) => {
            logToConsole(`UNCAUGHT: ${e.message} at ${e.filename}:${e.lineno}`);
        });
        
        // === ENVIRONMENT CHECK ===
        function runEnvironmentCheck() {
            const envDiv = document.getElementById('env-check');
            const checks = [
                { name: 'DOM Ready', test: () => document.readyState === 'complete' || document.readyState === 'interactive' },
                { name: 'window object', test: () => typeof window !== 'undefined' },
                { name: 'document object', test: () => typeof document !== 'undefined' },
                { name: 'localStorage', test: () => typeof localStorage !== 'undefined' },
                { name: 'Firebase available', test: () => typeof window.firebase !== 'undefined' || typeof window.db !== 'undefined' }
            ];
            
            checks.forEach(check => {
                const result = check.test();
                const div = document.createElement('div');
                div.className = `item ${result ? '' : 'warn'}`;
                div.textContent = `${result ? '✓' : '⚠'} ${check.name}`;
                envDiv.appendChild(div);
            });
        }
        
        // === FUNCTIONS CHECK ===
        function runFunctionsCheck() {
            const funcDiv = document.getElementById('functions-check');
            const funcs = [
                'renderMenu', 'calculateEventEstimate', 'setupMenuAnchorHighlight', 'attachMenuNavHandlers',
                'formatCOP', 'checkout', 'addToCart', 'updateCartDisplay', 'showUserSection',
                'fnv1aHashHex', 'startAdminListeners'
            ];
            
            funcs.forEach(f => {
                const exists = typeof window[f] !== 'undefined';
                const div = document.createElement('div');
                div.className = `item ${exists ? '' : 'error'}`;
                div.textContent = `${exists ? '✓' : '✗'} ${f}`;
                funcDiv.appendChild(div);
            });
        }
        
        // === DOM ELEMENTS CHECK ===
        function runDOMCheck() {
            const domDiv = document.getElementById('dom-check');
            const elements = {
                'menu-grid': 'Menu container',
                'menu-anchor-nav': 'Menu nav bar',
                'order-customer-name': 'Order name input',
                'order-table-number': 'Table number input',
                'order-address': 'Address input',
                'delivery-type': 'Delivery type select',
                'event-menu': 'Event menu select',
                'event-decor': 'Event decor select',
                'cost-total': 'Cost display',
                'cart-drawer': 'Cart drawer',
                'cart-items': 'Cart items list',
                'user-nav': 'User navbar',
                'employee-nav': 'Employee navbar'
            };
            
            for (const [id, desc] of Object.entries(elements)) {
                const el = document.getElementById(id);
                const div = document.createElement('div');
                div.className = `item ${el ? '' : 'error'}`;
                div.textContent = `${el ? '✓' : '✗'} ${desc} (#${id})`;
                domDiv.appendChild(div);
            }
        }
        
        // === DATA CHECK ===
        function runDataCheck() {
            const dataDiv = document.getElementById('data-check');
            try {
                if (!window.menuItems) throw new Error('menuItems not defined');
                const div1 = document.createElement('div');
                div1.className = 'item';
                div1.textContent = `✓ menuItems: ${window.menuItems.length} items`;
                dataDiv.appendChild(div1);
                
                const categories = [...new Set(window.menuItems.map(i => i.category))];
                const div2 = document.createElement('div');
                div2.className = 'item';
                div2.textContent = `✓ Categories: ${categories.join(', ')}`;
                dataDiv.appendChild(div2);
                
                const expectedCats = ['Entradas', 'Plato fuerte', 'Bebidas', 'Postre', 'Adiciones'];
                const hasAll = expectedCats.every(c => categories.includes(c));
                const div3 = document.createElement('div');
                div3.className = `item ${hasAll ? '' : 'error'}`;
                div3.textContent = `${hasAll ? '✓' : '✗'} All expected categories present`;
                dataDiv.appendChild(div3);
                
                if (window.USD_TO_COP) {
                    const div4 = document.createElement('div');
                    div4.className = 'item';
                    div4.textContent = `✓ USD_TO_COP: ${window.USD_TO_COP}`;
                    dataDiv.appendChild(div4);
                }
            } catch (e) {
                const div = document.createElement('div');
                div.className = 'item error';
                div.textContent = `✗ Error: ${e.message}`;
                dataDiv.appendChild(div);
            }
        }
        
        // === FEATURE TESTS ===
        function testMenuRendering() {
            const resultsDiv = document.getElementById('feature-results');
            const result = document.createElement('div');
            try {
                logToConsole('Starting menu rendering test...');
                const grid = document.getElementById('menu-grid');
                if (!grid) throw new Error('menu-grid not found');
                
                if (typeof renderMenu !== 'function') throw new Error('renderMenu is not a function');
                renderMenu();
                
                logToConsole('Menu rendering completed');
                const sections = grid.querySelectorAll('.menu-category-section');
                result.className = 'result ok';
                result.textContent = `✓ Menu rendered: ${sections.length} sections found`;
            } catch (e) {
                logToConsole(`Menu rendering error: ${e.message}`);
                result.className = 'result bad';
                result.textContent = `✗ Menu rendering failed: ${e.message}`;
            }
            resultsDiv.appendChild(result);
        }
        
        function testEventCalculation() {
            const resultsDiv = document.getElementById('feature-results');
            const result = document.createElement('div');
            try {
                logToConsole('Starting event calculation test...');
                const guestInput = document.getElementById('event-guests');
                const costDisplay = document.getElementById('cost-total');
                
                if (!guestInput || !costDisplay) throw new Error('Event form elements not found');
                if (typeof calculateEventEstimate !== 'function') throw new Error('calculateEventEstimate is not a function');
                
                guestInput.value = 50;
                calculateEventEstimate();
                const cost = costDisplay.textContent;
                
                logToConsole(`Event calculation result: ${cost}`);
                result.className = 'result ok';
                result.textContent = `✓ Event cost calculated: ${cost}`;
            } catch (e) {
                logToConsole(`Event calculation error: ${e.message}`);
                result.className = 'result bad';
                result.textContent = `✗ Event calculation failed: ${e.message}`;
            }
            resultsDiv.appendChild(result);
        }
        
        function testCartFunctions() {
            const resultsDiv = document.getElementById('feature-results');
            const result = document.createElement('div');
            try {
                logToConsole('Starting cart functions test...');
                if (typeof addToCart !== 'function') throw new Error('addToCart is not a function');
                if (typeof updateCartDisplay !== 'function') throw new Error('updateCartDisplay is not a function');
                
                const cartLen = window.cart ? window.cart.length : 0;
                logToConsole(`Current cart items: ${cartLen}`);
                
                result.className = 'result ok';
                result.textContent = `✓ Cart functions OK (cart has ${cartLen} items)`;
            } catch (e) {
                logToConsole(`Cart test error: ${e.message}`);
                result.className = 'result bad';
                result.textContent = `✗ Cart test failed: ${e.message}`;
            }
            resultsDiv.appendChild(result);
        }
        
        // === RUN ALL ON LOAD ===
        window.addEventListener('load', () => {
            logToConsole('=== Diagnostic page loaded ===');
            setTimeout(() => {
                runEnvironmentCheck();
                runFunctionsCheck();
                runDOMCheck();
                runDataCheck();
                logToConsole('=== Diagnostics complete ===');
            }, 500);
        });
    </script>
</body>
</html>
