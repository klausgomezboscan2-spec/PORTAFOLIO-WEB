<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Harness - El Sabor de la Vida</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 20px; }
        .test-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 10px 0; }
        .test-result { padding: 10px; margin: 5px 0; border-radius: 4px; font-weight: bold; }
        .pass { background: #90EE90; color: #000; }
        .fail { background: #FFB6C6; color: #000; }
        .warn { background: #FFD700; color: #000; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px 0; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>🧪 Test Harness - App Diagnostics</h1>
    <div class="test-panel">
        <h2>Validation Tests</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear</button>
        <div id="results"></div>
    </div>
    <div class="test-panel">
        <h2>Console Capture</h2>
        <textarea id="console-capture" readonly></textarea>
    </div>
    
    <script>
        const resultsDiv = document.getElementById('results');
        const captureArea = document.getElementById('console-capture');
        let testResults = [];
        
        // Intercept console
        const origLog = console.log, origError = console.error, origWarn = console.warn;
        console.log = (...args) => { 
            captureArea.value += '[LOG] ' + args.join(' ') + '\n';
            captureArea.scrollTop = captureArea.scrollHeight;
            origLog(...args); 
        };
        console.error = (...args) => { 
            captureArea.value += '[ERROR] ' + args.join(' ') + '\n';
            captureArea.scrollTop = captureArea.scrollHeight;
            origError(...args); 
        };
        console.warn = (...args) => { 
            captureArea.value += '[WARN] ' + args.join(' ') + '\n';
            captureArea.scrollTop = captureArea.scrollHeight;
            origWarn(...args); 
        };
        
        function addResult(name, passed, details='') {
            testResults.push({name, passed, details});
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${passed ? '✓' : '✗'} ${name} ${details ? '- ' + details : ''}`;
            resultsDiv.appendChild(div);
        }
        
        function testFunctionExistence() {
            const funcs = ['renderMenu', 'calculateEventEstimate', 'setupMenuAnchorHighlight', 'attachMenuNavHandlers', 'formatCOP', 'checkout', 'addToCart'];
            funcs.forEach(f => {
                const exists = typeof window[f] !== 'undefined';
                addResult(`Function exists: ${f}`, exists);
            });
        }
        
        function testDOM() {
            const elements = {
                'menu-grid': 'Menu grid container',
                'order-customer-name': 'Customer name input',
                'order-table-number': 'Table number input',
                'order-address': 'Address input',
                'delivery-type': 'Delivery type select',
                'event-menu': 'Event menu select',
                'event-decor': 'Event decor select',
                'cost-total': 'Cost total display',
                'cart-drawer': 'Cart drawer',
                'menu-anchor-nav': 'Menu nav bar'
            };
            
            for (const [id, desc] of Object.entries(elements)) {
                const el = document.getElementById(id);
                addResult(`DOM element: ${desc}`, !!el, el ? 'found' : 'MISSING');
            }
        }
        
        function testData() {
            try {
                if (!window.menuItems) throw new Error('menuItems undefined');
                addResult('menuItems exists', true, `${window.menuItems.length} items`);
                
                const categories = new Set(window.menuItems.map(i => i.category));
                const expected = new Set(['Entradas', 'Plato fuerte', 'Bebidas', 'Postre', 'Adiciones']);
                const allPresent = [...expected].every(c => categories.has(c));
                addResult('All categories present', allPresent, `Found: ${[...categories].join(', ')}`);
            } catch (e) {
                addResult('Data validation', false, e.message);
            }
        }
        
        function testMenuNavAnchors() {
            try {
                const links = document.querySelectorAll('.menu-nav-link');
                const count = links.length;
                addResult('Menu nav links exist', count > 0, `${count} links`);
                
                let allValid = true;
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    if (!href || !href.startsWith('#')) {
                        allValid = false;
                        console.warn(`Invalid anchor: ${href}`);
                    }
                });
                addResult('Menu nav anchors valid', allValid);
            } catch (e) {
                addResult('Menu nav test', false, e.message);
            }
        }
        
        function testEventEstimation() {
            try {
                // Setup: check for required elements
                const guestInput = document.getElementById('event-guests');
                const costDisplay = document.getElementById('cost-total');
                
                if (!guestInput || !costDisplay) {
                    addResult('Event form elements', false, 'inputs missing');
                    return;
                }
                
                guestInput.value = 50;
                if (typeof window.calculateEventEstimate === 'function') {
                    window.calculateEventEstimate();
                    const costText = costDisplay.textContent;
                    addResult('Event cost calculation', costText && costText !== '$0.00', `Result: ${costText}`);
                } else {
                    addResult('Event cost calculation', false, 'function not found');
                }
            } catch (e) {
                addResult('Event estimation', false, e.message);
            }
        }
        
        function runAllTests() {
            testResults = [];
            resultsDiv.innerHTML = '';
            captureArea.value = '';
            
            console.log('=== Starting Test Suite ===');
            testFunctionExistence();
            testDOM();
            testData();
            testMenuNavAnchors();
            testEventEstimation();
            console.log('=== Test Suite Complete ===');
            
            const passed = testResults.filter(r => r.passed).length;
            const total = testResults.length;
            const summary = document.createElement('div');
            summary.className = `test-result ${passed === total ? 'pass' : 'warn'}`;
            summary.textContent = `Summary: ${passed}/${total} tests passed`;
            resultsDiv.insertBefore(summary, resultsDiv.firstChild);
        }
        
        function clearResults() {
            testResults = [];
            resultsDiv.innerHTML = '';
            captureArea.value = '';
        }
        
        // Auto-run on page load
        window.addEventListener('load', () => {
            console.log('Test harness page loaded');
        });
    </script>
</body>
</html>
